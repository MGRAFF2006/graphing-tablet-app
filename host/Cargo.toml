[workspace]
resolver = "2"
members = [
    "crates/graphpad-core",
    "crates/graphpad-input-linux",
    "crates/graphpad-input-windows",
    "crates/graphpad-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/graphpad/graphing-tablet-app"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.9"
clap = { version = "=4.5.31", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
