[package]
name = "graphpad-daemon"
description = "GraphPad host daemon — receives iPad pen input and exposes a virtual tablet"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "graphpad-host"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
graphpad-core = { path = "../graphpad-core" }
log.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

graphpad-input-windows = { path = "../graphpad-input-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
graphpad-input-linux = { path = "../graphpad-input-linux" }
